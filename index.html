<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dia a Dia" />
    <title>Dia a Dia</title>
  </head>
  <body class="bg-slate-100">
    <!-- igual à tela de abertura do app (ícone + “Abrindo…”), para não piscar; aparece enquanto os arquivos chegam -->
    <div id="root"><div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui;color:#64748b;background:#f1f5f9">
      <img src="./icon-192.png" alt="" width="64" height="64" style="border-radius:16px" />
      <span style="font-size:14px">Abrindo…</span>
      <span id="boot-slow" style="display:none;font-size:13px;max-width:300px;text-align:center;line-height:1.4">Baixando o app pela internet. Só demora assim na primeira vez, depois de atualizar ou com a internet fraca.</span>
    </div></div>
    <script>
      // internet lenta: explica a espera (some sozinho quando o app abre)
      setTimeout(function () {
        var el = document.getElementById('boot-slow');
        if (!window.__appStarted && el) el.style.display = 'block';
      }, 2500);
      // Se o código do app nem chegar a rodar (arquivo velho em cache, rede), não fica preso em "Abrindo…".
      setTimeout(function () {
        if (window.__appStarted) return;
        document.getElementById('root').innerHTML =
          '<div style="font-family:system-ui;max-width:420px;margin:30vh auto 0;padding:24px;color:#334155">' +
          '<h1 style="font-size:20px">O app não abriu</h1>' +
          '<p style="font-size:14px">Seus dados continuam neste aparelho. Toque em atualizar (não apaga nada).</p>' +
          '<button id="fix" style="width:100%;height:48px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:600;font-size:16px">Atualizar o app</button></div>';
        document.getElementById('fix').onclick = async function () {
          try {
            var regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
            var keys = window.caches ? await caches.keys() : [];
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          } catch (e) {}
          location.reload();
        };
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
